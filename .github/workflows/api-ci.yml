name: Global Shuttle API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 3306
      DB_DATABASE: global_shuttle_ci
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_password
      DATABASE_URL: mysql://ci_user:ci_password@localhost:3306/global_shuttle_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test